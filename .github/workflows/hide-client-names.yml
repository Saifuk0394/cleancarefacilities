name: Replace client showcase with operating areas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-client-showcase:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace client showcase
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Replace the exact homepage client showcase section, preserving the existing
          # premium layout while removing identifiable community/client names.
          replacement = '''<section class="section mist" id="areas-operated">
    <div class="container">
      <div class="portfolio-top reveal">
        <div>
          <span class="eyebrow">Areas operated</span>
          <h2>Supporting residential communities across Mumbai.</h2>
        </div>
        <p>Clean Care deploys trained teams and operational resources according to each property's requirements, scope and service standards.</p>
      </div>
      <div class="portfolio" style="margin-top:31px">
        <div class="portfolio-block reveal">
          <h3>Operating footprint</h3>
          <div class="chips">
            <span class="chip">Mumbai</span>
            <span class="chip">Residential Communities</span>
            <span class="chip">Housing Societies</span>
            <span class="chip">Clubhouses &amp; Amenities</span>
          </div>
        </div>
        <div class="portfolio-block reveal delay1">
          <h3>Typical operating environments</h3>
          <div class="loc"><b>Residential Communities</b><span>Housekeeping, facility operations and technical support</span></div>
          <div class="loc"><b>Common Areas</b><span>Daily upkeep, periodic cleaning and quality supervision</span></div>
          <div class="loc"><b>Amenities &amp; Clubhouses</b><span>Cleaning and operational support for shared facilities</span></div>
        </div>
      </div>
    </div>
  </section>'''

          heading = 'Trusted across residential communities.'
          start = html.find(heading)
          if start == -1:
              raise SystemExit('Homepage client showcase heading not found')

          section_start = html.rfind('<section', 0, start)
          if section_start == -1:
              raise SystemExit('Could not find start of client showcase section')

          section_end = html.find('</section>', start)
          if section_end == -1:
              raise SystemExit('Could not find end of client showcase section')
          section_end += len('</section>')

          html = html[:section_start] + replacement + html[section_end:]

          # Rename the navigation item while retaining the same anchor position.
          html = re.sub(r'href="#(?:clients|portfolio)"([^>]*)>Clients</a>', r'href="#areas-operated"\1>Areas Operated</a>', html, flags=re.I)

          # Remove any remaining known client/community names from the homepage source.
          client_names = [
              'Sunrise CHS','Rainbow CHS','Hillside CHS','Lakeside CHS','Sunset I CHS','Golden Rays CHS',
              'Hillcrest 1','Hillcrest 2','Paradise CHS','Evening Glory CHS','Sunglory CHS','Sunglow CHS',
              'Twilight CHS','Harmony CHS','Sundew CHS','Silvercrest CHS','Adityavardhan CHS','Maple Leaf CHS',
              'Raheja Asencio CHS','Palatial Height CHS','Regent Hill Gardens','Harsh Vardhan CHS','Vasu Kamal CHS',
              'Parijat Tower CHS','ANSA D/E/F','Sagar Heritage CHS','Happiness CHS','Hurrah CHS','Celebration CHS',
              'Delight CHS','Lok Everest CHS'
          ]
          for name in client_names:
              html = html.replace(name, 'Residential Community')

          p.write_text(html, encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'id="areas-operated"' in html
          assert 'Areas Operated' in html
          forbidden = ['Sunrise CHS','Rainbow CHS','Hillside CHS','Lakeside CHS','Sunset I CHS','Golden Rays CHS','Hillcrest 1','Hillcrest 2','Paradise CHS','Evening Glory CHS','Sunglory CHS','Sunglow CHS','Twilight CHS','Harmony CHS','Sundew CHS','Silvercrest CHS','Adityavardhan CHS','Maple Leaf CHS','Raheja Asencio CHS','Palatial Height CHS','Regent Hill Gardens','Harsh Vardhan CHS','Vasu Kamal CHS','Parijat Tower CHS','ANSA D/E/F','Sagar Heritage CHS','Happiness CHS','Hurrah CHS','Celebration CHS','Delight CHS','Lok Everest CHS']
          assert not any(name in html for name in forbidden)
          print('Client-name removal validated')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "[skip ci] Replace client names with operating areas"
          git push
